[package]
name = "ocs-chat"
version = "1.7.1"
description = "OCS Chat - Rust + Vue3 + Tauri IM Application"
authors = ["OCS Team"]
edition = "2021"

[lib]
name = "ocs_chat_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
prost-build = "0.13"

[dependencies]
tauri = { version = "2", features = [ "protocol-asset", "tray-icon", "devtools", "macos-private-api"] }
tauri-plugin-notification = "=2.3.3"
tauri-plugin-deep-link = "=2.4.7"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-fs = "=2.4.5"
tauri-plugin-drag = "=2.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
prost = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
aes = "0.8"
ecb = "0.1"
pkcs7 = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rsa = "0.9"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", features = ["stream", "native-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
parking_lot = "0.12"
dashmap = "6"
chrono = "0.4"
url = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSPasteboard", "NSResponder", "NSEvent", "NSView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSString", "NSGeometry"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
