// 用户公告分页列表查询请求实体 【bizUrl/user/userNoticeList】
message UserNoticeListReq{
    ClientInfo      clientInfo      = 1; // 客户端信息
    int32       pageNum             = 2; // 当前页
    int32       pageSize            = 3; // 显示数
    int32       count               = 4; // 总数据量
    int32       noReadCount         = 5; // 未读公告总数
}
message UserNoticeListResp {
    CommonResult    commonResult      = 1; // 结果信息
    repeated  UserNotice userNotices  = 2; // 用户公告集合
    int32     pageNum                 = 3; // 当前页
    int32     pageSize                = 4; // 当前展示数
    int32     count                   = 5; // 总条数
    int32     noReadCount             = 6; // 未读总数
}
