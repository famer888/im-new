message UserNotice {
    int64       noticeId            = 1; // 公告id
    string      title               = 2; // 标题
    string      content             = 3; // 内容
    string      remindType          = 4; // 提醒方式 1:常规提醒 2:弹窗 3:置顶
    int32       readFlag            = 5; // 读取状态 0未读，1已读
    int64       updateTime          = 6; // 更新时间
}


