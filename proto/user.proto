syntax = "proto3";
option java_package="com.im.domain.pb";
option java_outer_classname="UserProto";

import "common.proto";

//************* 用户模块接口列表 ********************
// 更新用户资料请求 [bizUrl/user/update]
// 获取baiduToken请求 [baidu/baiduToke]
// 用户人脸认证回调请求 [user/faceRecognitionCallback]
// 初级、高级认证请求 [user/kycCertified]
// 用户资料详情 [bizUrl/user/detail]
// 更新设备码请求 [bizUrl/user/updateToken]
// 验证密码请求 [bizUrl/user/validatePassword]
// 设置密码请求 [bizUrl/user/password]
// 更换手机号请求 [bizUrl/user/updatePhone]
// 修改密码(检验旧密码)请求 [bizUrl/user/updatePassword]
// 修改密码(校验验证码)请求 [bizUrl/user/updatePasswordFromSmsCode]
// 用户消息通知统计列表请求实体 [bizUrl/user/notifyMsgStatistics]
// 用户消息通知列表 [bizUrl/user/notifyMsgList]
// 用户消息通知更新读取状态 [bizUrl/user/notifyMsgRead]
// 用户通知消息未读查询 [bizUrl/user/getUnreadNotifyMsgCount]
// 用户全局开关 [bizUrl/user/userGlobalSwitch]
// 获取敏感词数据集合 [bizUrl/user/getChatSensitive]
// 用户公告分页列表查询请求实体 [bizUrl/user/userNoticeList]
// 用户指定公告读取状态更新请求实体 [bizUrl/user/updateUserNoticeStatusById]
// 用户所有公告读取状态更新请求实体 [bizUrl/user/updateUserNoticeStatusAll]
// 用户删除指定公告请求实体 [bizUrl/user/delUserNoticeById]

// 上线时间不可见名单列表req [bizUrl/user/invisibleList]
// 更新不可见名单列表req [bizUrl/user/updateInvisibleList]
// 更新用户位置信息req [bizUrl/user/updateLocation] add V1.1.0（未使用）

// 获取表情包列表 [bizUrl/user/getEmoticon] add v1.5.0
// 添加表情包 [bizUrl/user/addEmoticon] add v1.5.0
// 移除表情包 [bizUrl/user/delEmoticon] add v1.5.0

// 绑定手机号 [bizUrl/user/bindPhone]
// 改绑手机号请求 [bizUrl/user/rebindPhone]
// 手机验证开关 [bizUrl/user/phoneValidate]
// 绑定邮箱 [bizUrl/user/bindEmail]
// 改绑邮箱请求 [bizUrl/user/rebindEmail]
// 邮箱验证开关 [bizUrl/user/emailValidate]

// 设置安全密码[bizUrl/user/tradePassword]
// 设置安全密码[bizUrl/user/updateTradePassword]
// 设置邮箱[bizUrl/user/setEmail]
// 设备列表[bizUrl/user/deviceList]
// 设备详情[bizUrl/user/deviceInfo]
// 删除设备[bizUrl/user/removeDevice]

// 创建批量归档[bizUrl/user/createArchive]
// 批量移除归档[bizUrl/user/removeArchive]
// 归档列表查询[bizUrl/user/queryArchive]

// TODO 废弃 实人认证初始化[bizUrl/user/initFaceVerify]
// TODO 废弃 查询实人认证结果[bizUrl/user/describeFaceVerify]

// 添加收款方式[bizUrl/user/addPayment]
// 我的收款方式[bizUrl/user/paymentList]
// 删除收款方式[bizUrl/user/removePayment]
// 修改收款方式[bizUrl/user/updatePayment]
// 身份认证[bizUrl/user/userAuthenticate]
// 身份认证查询[bizUrl/user/getUserAuthenticate]
// 用户安全验证列表[bizUrl/user/getUserSafeSwitchList]
// 用户修改翻译语种[bizUrl/user/userTranslationUpdate]
// 绑定快捷登录 谷歌或者苹果 [bizUrl/user/bindQuickLogin]
//************************************

// 操作类型
enum UserOperator {
    IGNORE              = 0; // 忽略更新
    ALL                 = 1; // 用户详情所有属性更新
    NICK_NAME           = 2; // 昵称
    ICON                = 3; // 头像
    PRIVACY             = 4; // 隐私设置值
    GENDER              = 5; // 性别
    SIGNATURE           = 6; // 个性签名
    VIEW_ONLINE_TIME    = 7; // 最后上线时间可见设置
    ADD_INVISIBLE       = 8; // 新增上线时间不可见名单
    DEL_INVISIBLE       = 9; // 移除上线时间不可见名单
    SET_LANG            = 10; // 多语言设置  add v1.2.0
    CLEAR_TIME          = 11; // 账号清除时间设置 v1.3.0
    IDENTIFY            = 12; // 68号
}

// 用户更新请求参数体
message UserParam {
    string          nickName       = 1; // 昵称
    string          icon           = 2; // 头像
    int32           privacy        = 3; // 隐私设置值
    Gender          gender         = 4; // 性别
    string          signature      = 5; // 个性签名
    LastOnlineTimeViewType  viewType   = 6; // 上线时间可见设置值
    int32           language       = 7; //多语言设置值    add v1.2.0
    ClearTimeType   clearTime      = 8; // 清楚账号时间设置值 v1.3.0
    string          identify       = 9; // 68号
}

// 创建批量归档请求 [bizUrl/user/createArchive]
message CreateArchiveReq {
    ClientInfo     clientInfo = 1; // 客户端信息
    repeated  ArchiveInfo   ArchiveInfo  = 2; // 操作类型列表
}

// 创建批量归档响应
message CreateArchiveResp {
    CommonResult   commonResult   = 1; // 结果信息
}

// 删除批量归档请求 [bizUrl/user/removeArchive]
message RemoveArchiveReq {
    ClientInfo     clientInfo = 1; // 客户端信息
    repeated  ArchiveInfo   ArchiveInfo  = 2; // 操作类型列表
}

// 删除批量归档响应
message RemoveArchiveResp {
    CommonResult   commonResult   = 1; // 结果信息
}

// 查询归档请求 [bizUrl/user/queryArchive]
message QueryArchiveReq {
    ClientInfo     clientInfo = 1; // 客户端信息
}

// 查询批量归档响应
message QueryArchiveResp {
    CommonResult   commonResult    = 1; // 结果信息
    repeated  ArchiveInfo   ArchiveInfo  = 2; // 操作类型列表
}

// 更新用户资料请求 [bizUrl/user/update]
message UpdateReq {
    ClientInfo     clientInfo = 1; // 客户端信息
    repeated  UserOperator   ops  = 2; // 操作类型列表
    UserParam      userParam  = 3; // 用户更新数据体
}

// 更新用户资料响应
message UpdateResp {
    CommonResult   commonResult   = 1; // 结果信息
}

// baiduToken请求实体
message BaiduTokenReq {
    ClientInfo clientInfo   =   1; // 客户端信息
}
// baiduToken 返回实体
message BaiduTokenResp {
    CommonResult   commonResult     = 1; // 结果信息
    int64   expiresIn               = 3; // 过期时间 秒
    string  accessToken             = 6; // token

}

// 人脸认证callback 请求实体
message FaceRecognitionReq {
    ClientInfo clientInfo   =   1; // 客户端信息
    int32 similarity        =   2; // 人脸比较相似度
    int32 status            =   3; // 状通过态 1:认证通过 2:认证失败

}
// 人脸认证callback 返回实体
message FaceRecognitionResp {
    CommonResult   commonResult     = 1; // 结果信息

}
// 用户消息通知统计列表请求实体 [bizUrl/user/notifyMsgStatistics]
message UserNotifyMsgStatisticsReq {
    ClientInfo clientInfo   = 1; // 客户端信息
}
// 用户通知消息类型统计列表响应
message UserNotifyMsgStatisticsResp {
    CommonResult   commonResult     = 1; // 结果信息
    repeated UserNotifyMsgByTypeStatistics byTypeStatistics     = 2; // 消息通知类型统计对象
}
// 用户通知消息类型统计对象
message UserNotifyMsgByTypeStatistics {
    string notifyMsgType        = 1; // 通知类型
    string notifyMsgTypeDesc    = 2; // 通知描述
    int32  unreadMsgCount       = 3; // 未读消息总条数
    UserNotifyMsg userNotifyMsg = 4; // 一条最新的数据
}

// 用户消息通知 请求实体 [bizUrl/user/notifyMsgList]
message UserNotifyListReq {
    ClientInfo clientInfo   = 1; // 客户端信息
    string      readState   = 2; // 0未读，1已读
    int32       pageNum     = 3; // 当前页
    int32       pageSize    = 4; // 页面大小
    string      notifyMsgType   = 5; // 通知消息类型
}
// 用户消息通知 响应实体
message UserNotifyListResp {
    CommonResult   commonResult   = 1; // 结果信息
    repeated UserNotifyMsg userNotifyList  = 2;
    int32 unreadCount    = 3; // 未读条数

}
// 用户通知消息
message UserNotifyMsg {
    int64   msgId             = 1; // 消息id
    string  notifyTypeName    = 2; // 通知类型名称
    // 业务类型 1:转账成功 2:转账失败 3:收款成功 4:单发红包成功 5:群发红包成功 6:红包退款成功 7:单收红包成功 8:群收红包成功 9:匹配失败 10:买方交易取消
    // 11:资金安全审核失败 12:资金安全待审核 13:买方发起申诉 14:申诉失败 15:待付款 16:买方申诉成功 17:卖方待放币 18:卖方放币 19:卖方发起申诉 20:买方待付款
    // 21:卖方申诉成功 22:卖方交易取消 23:您有新的交易订单通知 24:已售罄通知 25:已取消通知
    int32   businessType      = 3;
    string  context           = 4; // 通知内容
    int32   readState         = 5; // 读取状态 0-未读，1-已读
    string  detail            = 6; // 通知详情内容
    int64   notifyTime        = 9; // 通知时间
    string  businessId        = 11; // 业务id
    string  extra             = 13; // 扩展字段
    NotifyMsgGroup  group     = 14; // 通知分组
    enum NotifyMsgGroup {
        TRANSFER            = 0; // 转账
        RECEIVER            = 1; // 收款
        RED_PACKAGE         = 2; // 红包
        RED_PACKAGE_CHANGE  = 3; // 红包账变
        BUY_AND_SELL        = 4; // 购买及出售
        SELL_MASTER         = 5; // 主单组
        OTHER               = 6; // 其它
        CHAT_TRANSFER       = 7; // 聊天转账
        AD_ORDER            = 8; // 广告自选区
        EXCHANGE            = 9; // 汇兑
    }
}

// 用户消息通知 请求实体 [bizUrl/user/notifyMsgRead]
message UserNotifyReadReq {
    ClientInfo      clientInfo      = 1; // 客户端信息
    string          notifyMsgType   = 2; // 通知类型
    repeated int64  msgIds          = 3; // 通知消息id

}
// 用户消息通知 请求实体 [bizUrl/user/notifyMsgRead]
message UserNotifyReadResp {
    CommonResult    commonResult    = 1; // 结果信息
    bool            flag            = 2; // 更改读取操作 flag=true 操作更新成功
}


// 用户通知消息未读查询请求对象 [bizUrl/user/getUnreadNotifyMsgCount]
message UserNotifyUnReadCountReq {
    ClientInfo  clientInfo  = 1; // 客户端信息
}
// 用户通知消息未读查询响应对象 [bizUrl/user/getUnreadNotifyMsgCount]
message UserNotifyUnReadCountResp {
    CommonResult    commonResult    = 1; // 结果信息
    int32  unreadCount  = 2; // 未读数量
}

// 用户资料详情 [bizUrl/user/detail]
message DetailReq {
    ClientInfo     clientInfo     = 1; // 客户端信息
    int64          uid             = 2; // 用户ID
}

// 用户详情响应
message DetailResp {
    CommonResult   commonResult   = 1; // 结果信息
    UserBase       userBase       = 2; // 用户基本信息
    bool           bfPassword     = 3; // 是否设置密码
    int32          privacy        = 4; // 设置值
    string         signature      = 5; // 个性签名
    int32          viewType       = 6; // 可见设置值
    string         phone          = 7; // 手机号   add v1.1.0
    ClearTimeType  clearTime      = 8; // 清楚账号时间设置值 v1.3.0
    string         qrCode         = 9; // 二维码标识 v1.7.0
    string         email          = 10; // 邮箱
    bool           isBindGoogle          = 11; // 是否绑定谷歌
    bool           bfTradePassword       = 12; // 是否设置安全密码
    bool           bfRealAuth            = 13; // 是否真人认证 （视频认证）
    bool           isOpenSmsAuth         = 14; // 是否开启短信验证
    bool           isOpenEmailAuth       = 15; // 是否开启邮箱验证
    bool           isOpenGoogleAuth      = 16; // 是否开启谷歌验证
    bool           isBindBank            = 17; // 是否绑定银行卡
    bool           isVerifyRealName      = 18; // 是否验证真实姓名（名称+身份证号）
    bool           isVerifyId            = 19; // 是否验证身份证（上传了身份证图片）
    int32          authLevel             = 20; // 认证级别 0：未认证 1：初级认证 2：高级认证
    AuthTradeLimit authTradeLimit        = 21; // 授权限额
    TranslationInfo translationInfo      = 22; // 翻译语种为空则没有翻译白名单
    bool           isBindGoogleQuickLogin= 23; // 是否绑定google快捷登录
    bool           isBindAppleQuickLogin = 24; // 是否绑定apple快捷登录
    int64          authPassTime          = 25; // 认证通过时间
}
// 授权交易限额
message AuthTradeLimit {
    string primaryOneDayByUSDT   = 1; // 初级usdt单日限额
    string primaryOneDayBy68     = 2; // 初级68币单日限额
    string advancedOneDayByUSDT  = 3; // 高级usdt单日限额
    string advancedOneDayBy68    = 4; // 高级68币单日限额
}
// 初级认证、高级认证 实体
message KycCertifiedReq {
    ClientInfo     clientInfo   = 1;    // 客户端信息
    string  country             = 2;    // 国家编码
    string  idNumber            = 3;    // 身份证号码
    string  realName            = 4;    // 真实姓名
    string  idCardPositiveUrl   = 5;    // 身份证正面地址
    string  idCardNegativeUrl   = 6;    // 身份证反面地址
    string  similarity          = 7;    // 高级认证人脸比较相似度
    string  advanceStatus       = 8;    // 2通过，3失败
    string  procedure           = 9;    // 1初级，2高级，3初级与高级
    string  faceImage           = 10;   // 人脸图片 base64 -> V1.6.2
    string  awsSessionId        = 11;   // aws会话sessionId -> V2.1.0
}

// 初级认证、高级认证 响应
message KycCertifiedResp {
    CommonResult   commonResult   = 1; // 结果信息
}

// 更新设备码请求 [bizUrl/user/updateToken]
message UpdateTokenReq {
    ClientInfo     clientInfo     = 1; // 客户端信息
    string         token           = 2; // 设备码
    string         hwToken           = 3; // 华为设备码
}

// 更新设备码响应
message UpdateTokenResp {
    CommonResult   commonResult   = 1; // 结果信息
}

// 验证密码请求 [bizUrl/user/validatePassword]
message ValidatePasswordReq {
    ClientInfo     clientInfo     = 1; // 客户端信息
    string         password       = 2; // 密码
}

// 验证密码响应
message ValidatePasswordResp {
    CommonResult   commonResult   = 1; // 结果信息
}

// 验证密码请求 [bizUrl/user/phoneValidate]
message PhoneValidateReq {
    ClientInfo     clientInfo     = 1; // 客户端信息
    bool         isOpenSmsAuth       = 2; // 是否开启短信验证
    repeated ValidateCode validateCodes =3; //所有的验证码
}

// 验证密码响应
message PhoneValidateResp {
    CommonResult   commonResult   = 1; // 结果信息
}

// 验证密码请求 [bizUrl/user/emailValidate]
message EmailValidateReq {
    ClientInfo     clientInfo     = 1; // 客户端信息
    bool         isOpenEmailAuth  = 2; // 是否开启邮箱验证
    repeated ValidateCode validateCodes =3; //所有的验证码
}
// 验证密码响应
message EmailValidateResp {
    CommonResult   commonResult   = 1; // 结果信息
}

// 设置密码请求 [bizUrl/user/password]
message PasswordReq {
    ClientInfo     clientInfo     = 1; // 客户端信息
    string         password       = 2; // 密码
}

// 设置密码响应
message PasswordResp {
    CommonResult   commonResult   = 1; // 结果信息
}

// 更换手机号请求 [bizUrl/user/updatePhone]
message UpdatePhoneReq {
    ClientInfo     clientInfo     = 1; // 客户端信息
    string         countryCode    = 2; // 国家码
    string         phone          = 3; // 手机号
    string         oldPhone          = 4; // 旧手机号
    repeated ValidateCode validateCodes =5; //所有的验证码
}
// 更换手机号响应
message UpdatePhoneResp {
    CommonResult   commonResult   = 1; // 结果信息
}
// 更换手机号请求 [bizUrl/user/updateEmail]
message UpdateEmailReq {
    ClientInfo     clientInfo     = 1; // 客户端信息
    string         email    = 2; // 邮箱
    repeated ValidateCode validateCodes =3; //所有的验证码
}
// 更换邮箱响应
message UpdateEmailResp {
    CommonResult   commonResult   = 1; // 结果信息
}

// 修改密码(校验旧密码)请求 [bizUrl/user/updatePassword]
message UpdatePasswordReq {
    ClientInfo     clientInfo     = 1; // 客户端信息
    string         oldPassword    = 2; // 旧密码
    string         password       = 3; // 新密码
}

// 修改密码(校验旧密码)响应
message UpdatePasswordResp {
    CommonResult   commonResult   = 1; // 结果信息
}

// 修改密码(校验验证码)请求 [bizUrl/user/updatePasswordFromSmsCode]
message UpdatePasswordFromSmsCodeReq {
    ClientInfo     clientInfo     = 1; // 客户端信息
    string         countryCode    = 2; // 国家码
    string         phone          = 3; // 手机号
    string         smsCode        = 4; // 验证码
    string         password       = 5; // 密码
}

// 修改密码(校验验证码)响应
message UpdatePasswordFromSmsCodeResp {
    CommonResult   commonResult   = 1; // 结果信息
}
