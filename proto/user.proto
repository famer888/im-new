    ClientInfo      clientInfo     = 1; // 客户端信息
}
// 用户全局开关响应对象
message UserGlobalSwitchResp {
    CommonResult    commonResult            = 1; // 结果信息
    bool            buyFunSwitch            = 2; // 购买功能开关
    bool            sellFunSwitch           = 3; // 出售功能开关
    bool            transferFunSwitch       = 4; // 转账功能开关
    bool            proceedsFunSwitch       = 5; // 收款功能开关
    bool            redPacketFunSwitch      = 6; // 红包功能开关
    bool            experienceAuthSwitch    = 7; // 内测体验权限开关
    bool            chatTransferGroupSwitch = 8; // 群聊天转账开关
    bool            chatTransferSingleSwitch = 9; // 单聊天转账开关
    bool            chatTransferGroupReceiveSwitch = 10; // 群聊天转账领取开关
    bool            chatTransferSingleReceiveSwitch = 11; // 单聊天转账领取开关
    bool            chatTransferGroupSendSwitch = 12; // 群聊天转账发送开关
    bool            chatTransferSingleSendSwitch = 13; // 单聊天转账发送开关
    UserSwitchResp  globalShortcut = 14; // 全局快捷区信息
    UserSwitchResp  globalOptional = 15; // 全局自选区信息
    UserSwitchResp  globalExchange = 16; // 全局汇兑区信息
}

message UserSwitchResp{
    bool  totalSwitch = 1; // 开关状态及时间说明  1、开：  1.1 时间在维护范围内容: 展示维护中 1.2 当前时间不在时间范围内容，展示正常买卖页面 2、 关 展示敬请期待
    int64 maintenanceTimeStart  = 2; // 维护时间起始
    int64 maintenanceTimeEnd   = 3; // 维护时间终止
    bool  buyFunSwitch  = 4; // 购买功能开关
    bool  sellFunSwitch = 5; // 出售功能开关
}

