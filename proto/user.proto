}

// 更新用户位置信息请求 [bizUrl/user/updateLocation]--（未使用）
message UpdateLocationReq {
    ClientInfo     clientInfo     = 1; // 客户端信息
    int32   lat = 2; // LAT
    int32   lng = 3; // LNG
