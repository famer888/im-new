name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    tags:
      - 'v*'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}

    steps:
      - name: Determine tag and release name
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="Release ${{ github.ref_name }}"
            IS_PRERELEASE="false"
          else
            TAG_NAME="dev-run-${{ github.run_number }}"
            RELEASE_NAME="Dev Build #${{ github.run_number }} - $(date +'%Y-%m-%d %H:%M:%S')"
            IS_PRERELEASE="true"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

  create-release:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.setup.outputs.tag_name }}
          release_name: ${{ needs.setup.outputs.release_name }}
          draft: false
          prerelease: ${{ needs.setup.outputs.is_prerelease }}

  build-windows:
    needs: create-release
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: 1.85.1
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust version (CI must be >= 1.80 for time crate)
        run: rustc -Vv

      - name: Install protobuf compiler (Windows)
        run: choco install protoc

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTUP_TOOLCHAIN: 1.85.1
        with:
          args: --bundles nsis

      - name: Find and upload Windows installer
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXE_PATH=$(find ./src-tauri/target/release/bundle/nsis -name "*.exe" 2>/dev/null | head -1)
          if [ -z "$EXE_PATH" ]; then
            echo "Error: EXE file not found"
            ls -la ./src-tauri/target/release/bundle/nsis/ || echo "nsis directory not found"
            exit 1
          fi
          echo "Found EXE: $EXE_PATH"
          TAG_NAME="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            TAG_NAME="dev-run-${{ github.run_number }}"
          fi
          gh release upload "$TAG_NAME" "$EXE_PATH" --clobber

  build-macos:
    needs: create-release
    runs-on: macos-latest
    env:
      RUSTUP_TOOLCHAIN: 1.85.1
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust version (CI must be >= 1.80 for time crate)
        run: rustc -Vv

      - name: Install protobuf compiler (macOS)
        run: brew install protobuf

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTUP_TOOLCHAIN: 1.85.1
        with:
          args: --bundles dmg

      - name: Find and upload DMG
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG_PATH=$(find ./src-tauri/target/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -1)
          if [ -z "$DMG_PATH" ]; then
            echo "Error: DMG file not found"
            ls -la ./src-tauri/target/release/bundle/dmg/ || echo "dmg directory not found"
            exit 1
          fi
          echo "Found DMG: $DMG_PATH"
          TAG_NAME="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            TAG_NAME="dev-run-${{ github.run_number }}"
          fi
          gh release upload "$TAG_NAME" "$DMG_PATH" --clobber
