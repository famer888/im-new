<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCS Chat</title>
  <style>
    html, body, #app { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    body { font-family: 'PingFang SC', 'Noto Sans SC', 'Roboto', -apple-system, sans-serif; }
  </style>
  <script>
    // 通知子窗口在 Vue 挂载前也要保持透明，避免 Windows WebView2 先闪白底。
    (function () {
      var hash = String(window.location.hash || '');
      if (!hash.startsWith('#/notification')) return;
      var transparent = 'transparent';
      document.documentElement.style.background = transparent;
      document.body.style.background = transparent;
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
